<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Argus Captcha — demo</title>
    <style>
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1.2rem;
        padding: 2rem 1rem;
        font-family: system-ui, sans-serif;
        background: #0b0d17;
        color: #f0edf4;
      }
      h1 {
        font-size: 1.1rem;
        margin: 0;
      }
      .sub {
        color: #a8a4b4;
        font-size: 0.85rem;
        max-width: 32rem;
        text-align: center;
      }
      .panel {
        border: 1px solid #23263a;
        border-radius: 12px;
        padding: 1rem;
      }
      pre {
        font-size: 0.75rem;
        background: #11131f;
        border: 1px solid #23263a;
        border-radius: 8px;
        padding: 0.8rem 1rem;
        max-width: 32rem;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <h1>Argus Captcha — host page demo</h1>
    <p class="sub">
      One script tag embeds the widget. Everything in the box runs in an Argus-origin iframe; this
      page only receives the result message and forwards the token to its server for verify.
    </p>

    <div class="panel"><div class="argus-captcha"></div></div>
    <pre id="out">waiting for events…</pre>

    <script>
      const out = document.getElementById('out');
      const log = [];
      const push = (o) => {
        log.unshift(`${new Date().toLocaleTimeString()}  ${JSON.stringify(o)}`);
        out.textContent = log.slice(0, 12).join('\n');
      };
      function onArgusResult(r) {
        push({ RESULT: r });
        // In production: send r.token to your server, which POSTs it to
        //   {embedOrigin}/api/verify   body { token, cpi }
        // for the trusted { valid, verdict, sessionId, cpi }. Never trust
        // r.verdict from the browser alone — the token is the proof.
      }
      window.onArgusResult = onArgusResult;
      window.addEventListener('message', (e) => {
        const d = e.data;
        if (d && d.source === 'argus-captcha' && d.event !== 'result') push(d);
      });
    </script>

    <!-- loader is served from this same CDN origin; embed origin is baked into it -->
    <script
      src="/captcha.js"
      data-cpi="argus_cpi_test_demo123456"
      data-onresult="onArgusResult"
    ></script>
  </body>
</html>
