<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>captcha.js — host page demo</title>
    <style>
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1.2rem;
        padding: 2rem 1rem;
        font-family: system-ui, sans-serif;
        background: #0b0d17;
        color: #f0edf4;
      }
      h1 {
        font-size: 1.1rem;
        margin: 0;
      }
      .sub {
        color: #a8a4b4;
        font-size: 0.85rem;
        max-width: 30rem;
        text-align: center;
      }
      pre {
        font-size: 0.75rem;
        background: #11131f;
        border: 1px solid #23263a;
        border-radius: 8px;
        padding: 0.8rem 1rem;
        max-width: 30rem;
        white-space: pre-wrap;
      }
      .panel {
        border: 1px solid #23263a;
        border-radius: 12px;
        padding: 1rem;
      }
    </style>
  </head>
  <body>
    <h1>Pretend customer page</h1>
    <p class="sub">
      This page embeds the widget with one script tag. Everything below the dashed box runs in an
      Argus-origin iframe; this page only receives the result message.
    </p>

    <!-- the only thing a customer writes: -->
    <div class="panel"><div class="argus-captcha"></div></div>

    <pre id="out">waiting for events…</pre>

    <script>
      const out = document.getElementById('out');
      const log = [];
      function pushLog(o) {
        log.unshift(`${new Date().toLocaleTimeString()}  ${JSON.stringify(o)}`);
        out.textContent = log.slice(0, 12).join('\n');
      }
      // result callback named in data-onresult
      function onArgusResult(r) {
        pushLog({ RESULT: r });
        // In production: send r.token to your server, which POSTs it to
        //   {pairOrigin}/api/verify   body { token, cpi }
        // to get the trusted { valid, verdict, sessionId, cpi }. Never trust
        // r.verdict from the browser alone — the token is the proof.
      }
      window.onArgusResult = onArgusResult;
    </script>

    <!-- served from the same origin as this page in local dev -->
    <script src="/captcha.js" data-cpi="argus_cpi_test_demo" data-onresult="onArgusResult"></script>
    <script>
      // also subscribe to lifecycle events for the demo log
      if (window.argusCaptcha) {
        // re-render explicitly so we can attach onEvent (auto-mount used data-onresult only)
        const el = document.querySelector('.argus-captcha');
        if (el && el.__argusMounted) {
          /* already auto-mounted; lifecycle still logged via the message listener below */
        }
      }
      window.addEventListener('message', (e) => {
        const d = e.data;
        if (d && d.source === 'argus-captcha' && d.event !== 'result') pushLog(d);
      });
    </script>
  </body>
</html>
