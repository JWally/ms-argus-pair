pre-commit:
  parallel: true
  commands:
    format:
      glob: '*.{ts,tsx,json,md,yml,yaml,css,html}'
      run: npx prettier --check {staged_files}
    lint:
      glob: '*.{ts,tsx}'
      run: npx eslint {staged_files} --max-warnings 0 --no-warn-ignored
    typecheck:
      glob: '*.{ts,tsx}'
      run: npx tsc --noEmit

pre-push:
  parallel: true
  commands:
    build:
      # PAIR_ALLOW_ORIGIN_FALLBACK acknowledges this is a lint-build,
      # not a real deploy. The actual deploy script (`npm run deploy`)
      # sets VITE_PAIR_URL_BASE explicitly so the guard fires only when
      # someone runs cdk deploy directly without sourcing env.
      run: PAIR_ALLOW_ORIGIN_FALLBACK=1 npm run build
    dead-code:
      # knip — unused exports / files / dependencies. Ratchet baseline
      # as of branch chore/add-quality-gates: clean. Any new unused
      # export, file, or package dependency blocks the push. Grandfather
      # intentional latent code (e.g. OAuth provider scaffolds) with a
      # `@public` JSDoc tag on the export.
      run: npm run dead-code
