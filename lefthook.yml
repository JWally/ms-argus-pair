pre-commit:
  parallel: true
  commands:
    format:
      glob: '*.{ts,tsx,json,md,yml,yaml,css,html}'
      run: npx prettier --check {staged_files}
    lint:
      glob: '*.{ts,tsx}'
      run: npx eslint {staged_files} --max-warnings 0 --no-warn-ignored
    typecheck:
      glob: '*.{ts,tsx}'
      # tsc -b, NOT --noEmit: the solution-style root tsconfig has files:[]
      # so a bare --noEmit typechecks ZERO files and always exits 0.
      run: npx tsc -b

pre-push:
  parallel: true
  commands:
    build:
      # PAIR_ALLOW_ORIGIN_FALLBACK acknowledges this is a lint-build,
      # not a real deploy. The actual deploy script (`npm run deploy`)
      # sets VITE_PAIR_URL_BASE explicitly so the guard fires only when
      # someone runs cdk deploy directly without sourcing env.
      run: PAIR_ALLOW_ORIGIN_FALLBACK=1 npm run build && npm run test:hygiene
    test:
      # vitest unit tests (tests/**) — the TDD track. Build-artifact hygiene
      # checks stay in the build command above.
      run: npm test
    coverage:
      # Low initial thresholds in vitest.config.ts; ratchet upward as modules
      # are extracted and tested.
      run: npm run test:coverage
    duplication:
      # jscpd ratchet (threshold in package.json "jscpd") — baseline 0.47%.
      run: npm run duplication
    dead-code:
      # knip — unused exports / files / dependencies. Ratchet baseline
      # as of branch chore/add-quality-gates: clean. Any new unused
      # export, file, or package dependency blocks the push. Grandfather
      # intentional latent code (e.g. OAuth provider scaffolds) with a
      # `@public` JSDoc tag on the export.
      run: npm run dead-code
    boundaries:
      # Dependency graph boundaries: no cycles and no UI/server layering leaks.
      run: npm run boundaries
    spell:
      # Terminology/identifier drift check. Add intentional domain terms to
      # cspell.json rather than letting typos become API names.
      run: npm run spell
