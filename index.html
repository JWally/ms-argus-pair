<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#4d1979" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preload" href="/fonts/InterVariable.woff2" as="font" type="font/woff2" crossorigin />
    <link
      rel="preload"
      href="/fonts/JetBrainsMono-Regular.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <title>Argus Pair · Stop bots. Prove the human.</title>
    <!-- Argus integrity SDK. Provides window.argus.run() / .signAssertion() /
         .getDevicePublicKey() used by the dual-scan co-attestation flow.
         `defer`: the SDK isn't touched until the user taps the button, so it
      doesn't need to block the parser. -->
    <script
      defer
      src="https://static-integrity-dev-jw.argus.pw/argus-bootstrap.v1.iife.js"
      integrity="sha384-Xlk1NUBUkQ8me8iYU9VzSC5paRIP/HLE9MFO9lcfh1aVUNcv17d2JekChqjhU8oM"
      crossorigin="anonymous"
    ></script>
    <style>
      /* Splash spinner keyframes — defined in <head> so they survive
         React's `createRoot.render()` clobber of #root. If this lived
         inside #root (as the old inline splash did) the keyframes would
         vanish on mount and the Suspense-fallback Splash spinner would
         render but not spin — visually reading as "spinner stopped,
         page about to appear, then spinner starts again". */
      @keyframes argusPairSpin {
        to {
          transform: rotate(360deg);
        }
      }
      /* Inline body background so the page doesn't flash white in the
         window between HTML parse and tailwind CSS load. The Tailwind
         `bg-bg text-white` utilities on <body> only apply once
         /assets/*.css arrives — without this fallback, a bright white
         margin shows around the splash on slow paints and again
         during any SW-driven reload (FOUC). Belt-and-suspenders since
         the inline #root splash already covers 100dvh, but margins,
         scrollbars, and any html-level overflow can still leak. */
      html,
      body {
        background: #0d0f1a;
        color: rgba(255, 255, 255, 0.92);
        margin: 0;
      }
    </style>
  </head>
  <body class="bg-bg-primary text-fg-primary">
    <!--
      Inline pre-React splash. Paints at first byte so the user sees the
      brand + a spinning indicator instead of a blank screen during the
      ~1.5s bundle download + parse window on mobile 4G. React replaces
      `#root`'s children when it mounts, so the splash naturally goes away
      without a teardown step.

      IMPORTANT: the flex/centering layout lives on the INNER `.splash`
      wrapper, NOT on `#root`. React keeps `#root`'s own inline `style`
      attribute after mount — if `display:flex; align-items:center` sat on
      `#root`, the whole app would be shrink-wrapped and centered into a
      narrow column. `#root` keeps only FOUC-safe paint + font props.
    -->
    <div
      id="root"
      style="
        background: #0d0f1a;
        color: rgba(255, 255, 255, 0.92);
        font-family:
          'Inter',
          system-ui,
          -apple-system,
          sans-serif;
      "
    >
      <div
        style="
          min-height: 100dvh;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 1.5rem;
        "
      >
        <div style="font-size: 1.15rem; font-weight: 600; letter-spacing: 0.04em">
          argus<span style="color: #b388ff">.pair</span>
        </div>
        <div
          aria-hidden="true"
          style="
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.18);
            border-top-color: #b388ff;
            animation: argusPairSpin 0.7s linear infinite;
          "
        ></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
